name: Portfolio (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Construire le site
        working-directory: portfolio
        run: uvx --from "mkdocs-material>=9.6,<10" mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
